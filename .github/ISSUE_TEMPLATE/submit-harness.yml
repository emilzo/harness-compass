name: Submit your harness
description: Submit a harness for audit and ranking (public, private, or estimate track)
title: "[Submission] <harness name>"
labels: ["harness-submission"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for submitting! Audit your repo in the app first (**📂 Audit a folder** — 100% local),
        click **⬇ Export JSON** and paste it below. Full details in [CONTRIBUTING.md](../blob/main/CONTRIBUTING.md).
  - type: input
    id: name
    attributes:
      label: Harness name
    validations:
      required: true
  - type: input
    id: vendor
    attributes:
      label: Vendor / author
    validations:
      required: true
  - type: input
    id: repo
    attributes:
      label: Repository URL (public repo for the public track; private repos go through the private track)
    validations:
      required: true
  - type: dropdown
    id: track
    attributes:
      label: Audit track
      description: "Public: report published, AUDITED badge. Private: report delivered only to you, no public listing (the public badge requires published evidence). Estimate: you open a PR with justified scores."
      options:
        - Public audit (report published, AUDITED badge)
        - Private audit (confidential — report only to me, no public listing)
        - Estimate entry (I will open a PR with justified scores)
    validations:
      required: true
  - type: textarea
    id: json
    attributes:
      label: Exported JSON from the local audit
      description: Paste the file downloaded by "Export JSON" (it contains your 22 preliminary scores and the adjusted-dimensions counter).
      render: json
    validations:
      required: true
  - type: textarea
    id: notes
    attributes:
      label: Anything the auditors should know (optional)
  - type: checkboxes
    id: policy
    attributes:
      label: Integrity policy
      options:
        - label: I understand that the public AUDITED badge requires published evidence, that private audits are not listed publicly, and that manual score adjustments stay visibly flagged.
          required: true
