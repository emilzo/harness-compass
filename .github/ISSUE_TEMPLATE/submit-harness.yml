name: Submit your harness
description: Submit a harness publicly for audit and ranking (public or estimate track)
title: "[Submission] <harness name>"
labels: ["harness-submission"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for submitting! Audit your repo in the app first (**📂 Audit a folder** — 100% local),
        click **⬇ Export JSON** and paste it below. Full details in [CONTRIBUTING.md](../blob/main/CONTRIBUTING.md).

        **This issue is public.** For a private or confidential audit, do not open
        an issue and do not paste private code here. Email **emilio.mina@gmail.com**
        first so we can agree on a safe transfer method.
  - type: input
    id: name
    attributes:
      label: Harness name
    validations:
      required: true
  - type: input
    id: vendor
    attributes:
      label: Vendor / author
    validations:
      required: true
  - type: input
    id: repo
    attributes:
      label: Public repository URL
    validations:
      required: true
  - type: dropdown
    id: track
    attributes:
      label: Audit track
      description: "Public: report published, AUDITED badge. Estimate: you open a PR with justified scores. Private audits start by email, never through a public issue."
      options:
        - Public audit (report published, AUDITED badge)
        - Estimate entry (I will open a PR with justified scores)
    validations:
      required: true
  - type: textarea
    id: json
    attributes:
      label: Exported JSON from the local audit
      description: Paste the file downloaded by "Export JSON" (it contains your 22 preliminary scores and the adjusted-dimensions counter).
      render: json
    validations:
      required: true
  - type: textarea
    id: notes
    attributes:
      label: Anything the auditors should know (optional)
  - type: checkboxes
    id: policy
    attributes:
      label: Integrity policy
      options:
        - label: I understand that the public AUDITED badge requires published evidence, that private audits are not listed publicly, and that manual score adjustments stay visibly flagged.
          required: true
