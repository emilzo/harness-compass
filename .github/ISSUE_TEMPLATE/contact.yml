name: Contact / feedback
description: Public questions, feedback, corrections and reproducible bugs
title: "[Contact] "
body:
  - type: markdown
    attributes:
      value: |
        Thanks for contacting Harness Compass.

        **This issue will be public.** Do not include passwords, API keys,
        proprietary code, private repository details or confidential data.
        For a private audit or confidential matter, email
        **emilio.mina@gmail.com** instead.
  - type: dropdown
    id: reason
    attributes:
      label: What is this about?
      options:
        - Method or HCI question
        - Data or score correction
        - Reproducible bug
        - Feature idea
        - Collaboration
        - Something else
    validations:
      required: true
  - type: textarea
    id: message
    attributes:
      label: Message
      description: Include public links or reproduction steps when useful.
    validations:
      required: true
  - type: input
    id: reply
    attributes:
      label: How may we reply? (optional)
      description: You may leave this empty and continue the conversation in this public issue.
  - type: checkboxes
    id: privacy
    attributes:
      label: Public issue
      options:
        - label: I confirm that this message contains no secrets, proprietary code or confidential data.
          required: true
