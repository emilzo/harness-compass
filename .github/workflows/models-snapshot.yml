name: models-snapshot
on:
  schedule:
    - cron: "0 3 * * *"   # daily at 03:00 UTC
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Fetch OpenRouter models
        run: node scripts/snapshot-models.mjs
      - name: Open a pull request when the snapshot changed
        # peter-evans/create-pull-request v8.1.1
        # If docs/models is unchanged, this step exits without opening a pull request.
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1
        with:
          branch: models-snapshot
          base: main
          delete-branch: true
          add-paths: |
            docs/models/latest.json
            docs/models/history.json
          author: github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>
          committer: github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>
          commit-message: "Update the OpenRouter model snapshot."
          title: "Update OpenRouter model snapshot"
          body: |
            Daily snapshot of OpenRouter models.

            This updates docs/models/latest.json and docs/models/history.json when the list or prices change.

            The workflow uses the default GITHUB_TOKEN. GitHub does not start the required test workflow until someone with write access approves it on this pull request. Auto-merge is not enabled on the repository, so this pull request is merged by hand.
