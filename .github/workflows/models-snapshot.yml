name: models-snapshot
on:
  schedule:
    - cron: "0 3 * * *"   # daily at 03:00 UTC
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write
  actions: write

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Fetch OpenRouter models
        run: node scripts/snapshot-models.mjs
      - name: Open a pull request when the snapshot changed
        id: snapshot-pr
        # peter-evans/create-pull-request v8.1.1
        # If docs/models is unchanged, this step exits without opening a pull request.
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1
        with:
          branch: models-snapshot
          base: main
          delete-branch: true
          add-paths: |
            docs/models/latest.json
            docs/models/history.json
          author: github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>
          committer: github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>
          commit-message: "Update the OpenRouter model snapshot."
          title: "Update OpenRouter model snapshot"
          body: |
            Daily snapshot of OpenRouter models.

            This updates docs/models/latest.json and docs/models/history.json when the list or prices change.

            After this pull request is created or updated, the workflow runs `gh workflow run ci.yml --ref models-snapshot` with the default GITHUB_TOKEN. The job name is `test`. GitHub docs say a workflow_dispatch check does not appear on the pull request and does not satisfy a required status check in a branch ruleset. The pull_request run still needs a person with write access to approve it. Auto-merge is not enabled, so this pull request is merged by hand.
      - name: Dispatch the test workflow on the snapshot branch
        if: >-
          (steps.snapshot-pr.outputs.pull-request-operation == 'created' || steps.snapshot-pr.outputs.pull-request-operation == 'updated')
          && steps.snapshot-pr.outputs.pull-request-head-sha != ''
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ steps.snapshot-pr.outputs.pull-request-head-sha }}
        run: |
          gh workflow run ci.yml --ref models-snapshot
          echo "Dispatched ci.yml on models-snapshot at ${HEAD_SHA}."
